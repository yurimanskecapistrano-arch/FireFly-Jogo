<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#07171b"/><title>FireFly — Expedições ao Desconhecido</title><link rel="stylesheet" href="styles.css"/></head><body><main id="gameShell" aria-label="FireFly, jogo de exploração e captura"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="Mundo do FireFly"></canvas><section id="hud" aria-label="Interface do jogo"><div class="brand"><strong>FIREFLY</strong><span>EXPEDIÇÕES AO DESCONHECIDO</span></div><div class="status"><span id="time">DIA</span><span class="coins"><b id="coins">25</b> CR</span><button id="mute" aria-label="Ativar ou desativar som">SOM</button></div><div class="tool"><i></i><div><b>REDE DE FIOS</b><small id="prompt">Explore a vila</small></div></div><div class="controls-hint"><span>WASD</span><small>mover</small><span>SHIFT</span><small>correr</small><span>E</span><small>interagir</small></div><nav class="keys" aria-label="Menus"><button data-panel="bag"><b>I</b><small>MOCHILA</small></button><button data-panel="book"><b>B</b><small>BESTIÁRIO</small></button><button data-panel="quest"><b>M</b><small>MISSÕES</small></button><button data-panel="progress"><b>P</b><small>PROGRESSO</small></button><button data-panel="map"><b>J</b><small>MAPA</small></button></nav></section><aside id="panel" class="hidden"></aside><div id="dialog" class="hidden"></div><div id="toast" role="status"></div></main><script type="module" src="game/main.js"></script></body></html>
